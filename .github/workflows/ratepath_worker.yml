name: RatePath Cloud Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ratepath-live-worker
  cancel-in-progress: false

jobs:
  run-market-cycle:
    name: Fetch Markets, Analyze Macro News & Publish Live Feed
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Lane-1 pricing, catalog & change-only Rates Bulletin cycle (zero news alerts)
        env:
          PYTHONUTF8: "1"
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          TELEGRAM_PUBLIC_CHANNEL_EN: ${{ secrets.TELEGRAM_PUBLIC_CHANNEL_EN }}
          TELEGRAM_VIP_CHANNEL_EN: ${{ secrets.TELEGRAM_VIP_CHANNEL_EN }}
          TELEGRAM_PUBLIC_CHANNEL_AR: ${{ secrets.TELEGRAM_PUBLIC_CHANNEL_AR }}
          TELEGRAM_VIP_CHANNEL_AR: ${{ secrets.TELEGRAM_VIP_CHANNEL_AR }}
          MINI_APP_URL: ${{ secrets.MINI_APP_URL }}
          CMC_PRO_API_KEY: ${{ secrets.CMC_PRO_API_KEY }}
        run: python -m backend.run_cycle

      - name: Force-push live_feed.json & catalog_feed.json as clean orphan commit to live-data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s frontend/public/live_feed.json

          STAGE_DIR="$(mktemp -d)"
          cp frontend/public/live_feed.json "$STAGE_DIR/live_feed.json"
          if [ -s frontend/public/catalog_feed.json ]; then
            cp frontend/public/catalog_feed.json "$STAGE_DIR/catalog_feed.json"
          fi

          cd "$STAGE_DIR"
          git init -b live-data
          git config user.name "RatePath Serverless Bot"
          git config user.email "bot@ratepath.io"
          git add live_feed.json
          if [ -s catalog_feed.json ]; then
            git add catalog_feed.json
          fi
          git commit -m "chore(live-data): update live_feed.json & catalog_feed.json ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-data
