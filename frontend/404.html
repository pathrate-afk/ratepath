<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 — RatePath (ريت باث)</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/styles/tailwind.min.css" />
</head>
<body class="bg-[#070B14] text-slate-100 min-h-screen flex items-center justify-center p-5">
  <main class="max-w-md w-full text-center space-y-4 p-6 rounded-2xl bg-slate-900 border border-slate-800 shadow-2xl">
    <img src="/icons/logo-mark.png" alt="RatePath | ريت باث" width="48" height="48"
      class="w-10 h-10 mx-auto rounded-xl ring-1 ring-amber-400/45" />
    <div class="space-y-1.5">
      <p class="text-xs font-mono font-bold tracking-widest text-amber-400">ERROR 404</p>
      <h1 class="text-lg font-extrabold text-white">Page Not Found • الصفحة غير موجودة</h1>
      <p class="text-xs text-slate-400 leading-relaxed">
        The requested resource does not exist on RatePath. Return to the live market terminal below.
      </p>
    </div>
    <div class="flex items-center justify-center gap-2.5 pt-1">
      <a href="/?lang=en" class="px-4 py-2 rounded-xl text-xs font-extrabold bg-amber-400 hover:bg-amber-300 text-slate-950 transition-colors">
        English Terminal
      </a>
      <a href="/?lang=ar" class="px-4 py-2 rounded-xl text-xs font-extrabold bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-400/35 transition-colors">
        النسخة العربية
      </a>
    </div>
  </main>
</body>
</html>
